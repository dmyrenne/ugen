<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>μgen</title>
<style>
  /* Schriften liegen lokal in fonts/ (SIL Open Font License) */
  @font-face { font-family: 'Space Grotesk'; src: url(fonts/space-grotesk.woff2) format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; font-display: swap; }
  :root {
    --sans: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --bg: #f3f4f6; --panel: #ffffff; --field: #ffffff; --ink: #0c0d10; --muted: #71737c; --line: #e3e4e8; --line-strong: #c9cbd2;
    --accent: #2340ff; --accent-soft: #e8ebff; --accent-ink: #ffffff; --warn: #d4380d; --warn-bg: #fff1eb;
    --paper: #ffffff; --margin: #ff9a80; --dot: #d9dbe1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0f; --panel: #121318; --field: #0b0c0f; --ink: #eceef3; --muted: #8b8e99; --line: #23252d; --line-strong: #353843;
      --accent: #7187ff; --accent-soft: #1b2146; --accent-ink: #0b0c0f; --warn: #ff8a66; --warn-bg: #2d1710;
      --paper: #eceae4; --margin: #ff8a66; --dot: #1e2027;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 var(--sans); background: var(--bg); color: var(--ink);
         display: grid; grid-template-columns: 340px 1fr; height: 100vh; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent); }

  /* ---------- Seitenleiste ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 20px 28px;
          scrollbar-gutter: stable; counter-reset: sec; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 36px; height: 36px; border-radius: 9px; background: var(--ink); cursor: pointer; flex: none; }
  h1 { font-size: 22px; line-height: 1; margin: 0; font-weight: 700; letter-spacing: -.03em; }
  h1 small { display: block; white-space: nowrap; font: 500 10px/1.3 var(--mono); letter-spacing: .02em; color: var(--muted); margin-top: 4px; }
  .head select { width: auto; padding: 4px 8px; font-size: 12px; }
  h2 { display: flex; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
       margin: 24px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); }
  h2::before { counter-increment: sec; content: counter(sec, decimal-leading-zero); font: 500 11px var(--mono); color: var(--accent); }
  h2 button { margin-left: auto; }

  .gens { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gen { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel);
         text-align: left; cursor: pointer; font: 500 12px var(--sans); color: var(--ink); }
  .gen svg { width: 100%; aspect-ratio: 3 / 2; border-radius: 6px; background: var(--bg); }
  .gen:hover { border-color: var(--ink); }
  .gen[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .about { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  .params { display: grid; gap: 12px; }
  .param { display: grid; gap: 4px; }
  .param .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); }
  .param .top output { font: 500 12px var(--mono); color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 9px; color: var(--ink); font-size: 13px; cursor: pointer; }
  .full { grid-column: 1 / -1; }
  input[type=number], input[type=text], select {
         font: 500 13px var(--mono); color: var(--ink); background: var(--field); border: 1px solid var(--line-strong);
         border-radius: 6px; padding: 6px 8px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  select { font-family: var(--sans); font-size: 14px; font-weight: 400; }
  input:focus-visible, select:focus-visible, button:focus-visible {
         outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 32px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 6px;
                      background: var(--field); cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }
  button { font: 500 13px var(--sans); border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
           border-radius: 99px; padding: 6px 14px; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.small { padding: 3px 10px; font-size: 12px; }
  button:disabled { opacity: .35; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .seed { display: flex; gap: 6px; }
  .seed input { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  kbd { font: 500 11px var(--mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

  /* ---------- Arbeitsfläche ---------- */
  main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
  .toolbar { display: flex; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line);
             background: var(--panel); flex-wrap: wrap; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { display: block; font: 600 18px/1.2 var(--mono); letter-spacing: -.02em; }
  .stat span { font-size: 11px; color: var(--muted); }
  .spacer { flex: 1; }
  .stage { position: relative; min-height: 0; overflow: hidden;
           background: radial-gradient(circle, var(--dot) 1px, transparent 1.2px) 0 0 / 16px 16px, var(--bg); }
  .stage canvas { position: absolute; inset: 0; cursor: grab; }
  .busy { position: absolute; top: 12px; right: 16px; font: 500 11px var(--mono); color: var(--muted); }
  .bottom { padding: 10px 20px; border-top: 1px solid var(--line); background: var(--panel);
            display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; height: auto; }
    main { height: 80vh; }
  }
</style>
</head>
<body>
<aside>
  <div class="head">
    <div class="brand">
      <svg id="mark" viewBox="0 0 34 34" role="img" aria-label="μgen"></svg>
      <h1>µgen<small data-i18n="tagline"></small></h1>
    </div>
    <select id="lang" data-i18n-aria="lang"></select>
  </div>

  <h2 data-i18n="h.generator"></h2>
  <div class="gens" id="gens"></div>
  <p class="about" id="about"></p>

  <h2><span data-i18n="h.params"></span><button type="button" class="small" id="surprise" data-i18n="surprise" data-i18n-title="surprise.title"></button></h2>
  <div class="params" id="params"></div>
  <div class="row" style="margin-top:12px"><button type="button" class="small" id="resetParams" data-i18n="resetParams"></button></div>

  <h2 data-i18n="h.seed"></h2>
  <div class="seed">
    <input type="number" id="seed" min="0" step="1" data-i18n-aria="h.seed">
    <button type="button" id="dice" data-i18n="dice" data-i18n-title="dice.title"></button>
  </div>
  <p class="hint" data-i18n-html="seed.hint.html"></p>

  <h2 data-i18n="h.paper"></h2>
  <div class="grid">
    <label class="full"><span data-i18n="format"></span><select id="format"></select></label>
    <label><span data-i18n="paper_w"></span><input type="number" id="paper_w" min="10" max="2000" step="1"></label>
    <label><span data-i18n="paper_h"></span><input type="number" id="paper_h" min="10" max="2000" step="1"></label>
    <label><span data-i18n="margin"></span><input type="number" id="margin" min="0" max="200" step="1"></label>
    <button type="button" id="rotatePaper" data-i18n="rotatePaper"></button>
  </div>

  <h2 data-i18n="h.pen"></h2>
  <div class="grid">
    <label><span data-i18n="pen_color"></span><input type="color" id="pen_color"></label>
    <label><span data-i18n="pen_width"></span><input type="number" id="pen_width" min="0.05" max="5" step="0.05"></label>
  </div>
  <p class="hint" data-i18n="pen.hint"></p>
</aside>

<main>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <button id="play" data-i18n="play"></button>
    <button id="fitView" data-i18n="fitView"></button>
    <button class="primary" id="export" data-i18n="export"></button>
  </div>
  <div class="stage" id="stage"><span class="busy" id="busy" hidden></span></div>
  <div class="bottom">
    <span data-i18n-html="keys.html"></span>
    <span data-i18n-html="footer.html"></span>
  </div>
</main>

<script src="lib/p5.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="generators/meshblob.js"></script>
<script src="generators/flowfield.js"></script>
<script src="generators/waves.js"></script>
<script src="generators/harmonograph.js"></script>
<script>
  // Fehlen die Skripte (z. B. Browser als Flatpak mit file://), einen Hinweis zeigen statt einer leeren Seite
  if (typeof UGEN === 'undefined' || typeof p5 === 'undefined') {
    document.body.innerHTML = '<div style="margin:auto;max-width:520px;padding:32px;font:15px/1.6 system-ui">' +
      '<h1 style="font-size:22px">µgen konnte nicht starten</h1>' +
      '<p>Der Browser darf die Skripte neben <code>index.html</code> nicht laden. Das passiert z. B. bei Browsern als ' +
      'Flatpak oder Snap, wenn die Datei direkt geöffnet wird.</p>' +
      '<p>Bitte im Projektordner <code>./start.sh</code> ausführen und <b>http://127.0.0.1:5056</b> öffnen.</p></div>';
  } else UGEN.start();
</script>
</body>
</html>
