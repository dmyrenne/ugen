# Fester Projektname, unabhängig von Ordnername und Speicherort
name: ugen

services:
  ugen:
    image: ghcr.io/dmyrenne/ugen:latest
    # build: .                  # zum Bauen aus dem Quellcode einkommentieren, dann "docker compose up -d --build"
    ports:
      - "5056:8080"             # im ganzen Netz erreichbar; nur lokal: "127.0.0.1:5056:8080"
    restart: unless-stopped
